<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラマチック / ハルニシオン - コード譜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── 変数 ── */
    :root {
      --accent:        #bfef30;
      --chord-color:   #0055cc;
      --bg:            #ffffff;
      --surface:       #f5f5f5;
      --surface2:      #e8e8e8;
      --ink:           #111111;
      --ink-mid:       #444444;
      --muted:         #888888;
      --border:        #cccccc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    /* ═══════════════════════════════════════
       ヘッダー
    ═══════════════════════════════════════ */
    .song-header {
      padding: 36px 24px 22px;
      border-bottom: 2.5px solid var(--ink);
      background: var(--bg);
      text-align: center;
    }
    .song-title {
      font-size: 2.1em;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
    }
    .song-artist {
      font-size: 0.82em;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 0.1em;
      font-weight: 400;
      text-transform: uppercase;
    }
    .key-badge {
      display: inline-block;
      margin-top: 12px;
      background: var(--accent);
      color: var(--ink);
      padding: 3px 14px;
      border-radius: 2px;
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    /* YouTube（画面のみ） */
    .yt-wrapper {
      max-width: 400px;
      margin: 18px auto 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .yt-wrapper iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: none;
    }

    /* ═══════════════════════════════════════
       コントロールバー
    ═══════════════════════════════════════ */
    .controls {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 7px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .ctrl-group { display: flex; align-items: center; gap: 5px; }
    .ctrl-label { font-size: 0.68em; color: var(--muted); white-space: nowrap; letter-spacing: 0.06em; text-transform: uppercase; }
    .btn {
      background: var(--surface2);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 3px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 700;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); }
    .btn-wide  { width: auto; padding: 0 12px; font-size: 0.78em; white-space: nowrap; }
    .val       { min-width: 2.8em; text-align: center; font-weight: 700; color: var(--chord-color); font-size: 0.85em; }
    .capo-select {
      background: var(--surface2);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.78em;
      height: 28px;
      cursor: pointer;
    }
    .divider { width: 1px; height: 20px; background: var(--border); }

    /* ═══════════════════════════════════════
       コード譜
    ═══════════════════════════════════════ */
    .chord-sheet {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 28px 100px;
    }

    /* セクション */
    .section       { margin-bottom: 24px; }
    .section-label {
      display: inline-block;
      background: var(--ink);
      color: var(--accent);
      font-size: 0.65em;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 2px;
      margin-bottom: 7px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* コード行 */
    .chord-line {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1px;
      line-height: 1;
    }
    .spacer { height: 9px; }

    /* コード＋歌詞の1ブロック */
    .cb {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 1px;
    }

    /* コード名 */
    .ch {
      color: var(--chord-color);
      font-family: 'Inter', 'Menlo', monospace;
      font-weight: 800;
      font-size: 0.7em;
      min-height: 1.3em;
      line-height: 1.3;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }

    /* 歌詞 */
    .ly {
      font-size: 1em;
      line-height: 1.85;
      color: var(--ink);
      letter-spacing: 0.04em;
      white-space: pre;
    }

    .instr .ch { font-size: 0.85em; margin-right: 12px; }

    /* 印刷用QRコード（画面では非表示） */
    .print-qr { display: none; }

    /* ═══════════════════════════════════════
       フッター（画面のみ）
    ═══════════════════════════════════════ */
    .footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.68em;
      padding: 14px;
      letter-spacing: 0.06em;
    }

    /* ═══════════════════════════════════════
       印刷スタイル（A4 対応）
    ═══════════════════════════════════════ */
    @media print {
      /* 印刷領域と余白 */
      @page {
        size: A4 portrait;
        margin: 13mm 16mm 13mm 16mm;
      }

      /* 非表示 */
      .controls,
      .yt-wrapper,
      .footer { display: none !important; }

      /* ページ全体リセット */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body { background: white; font-size: 10pt; line-height: 1; }

      /* ヘッダー */
      .song-header {
        padding: 0 0 6pt;
        border-bottom: 1.5pt solid black;
        background: white !important;
        margin-bottom: 2pt;
      }
      .song-title  { font-size: 15pt; color: black; }
      .song-artist { font-size: 8pt;  color: #555;  margin-top: 2pt; }
      .key-badge {
        background: black !important;
        color: white !important;
        border-radius: 1px !important;
        font-size: 6.5pt;
        padding: 1pt 6pt;
        margin-top: 4pt;
      }

      /* コード譜レイアウト */
      .chord-sheet {
        padding: 6pt 0 0;
        max-width: 100%;
      }
      .section {
        margin-bottom: 8pt;
        break-inside: avoid;
      }

      /* リハーサルマーク風ラベル */
      .section-label {
        background: black !important;
        color: white !important;
        border-radius: 1px !important;
        font-size: 6pt;
        padding: 1.5pt 6pt;
        margin-bottom: 3pt;
        letter-spacing: 0.1em;
      }

      /* コード行 */
      .chord-line { margin-bottom: 0; }
      .spacer     { height: 4pt; }

      /* コード名：モノクロでも歌詞と区別できるよう極太・小さめ */
      .ch {
        color: black !important;
        font-weight: 900 !important;
        font-size: 6.5pt !important;
        min-height: 0.95em;
        line-height: 1.05;
        letter-spacing: 0.04em;
      }

      /* 歌詞 */
      .ly {
        font-size: 10pt !important;
        color: black !important;
        line-height: 1.45;
        letter-spacing: 0.02em;
      }

      .instr .ch { margin-right: 8pt !important; }

      /* 印刷用QRコード */
      .print-qr {
        display: flex !important;
        align-items: center;
        gap: 10pt;
        padding-top: 8pt;
        margin-top: 14pt;
        border-top: 0.75pt solid #aaa;
        break-inside: avoid;
      }
      .print-qr img   { width: 68pt; height: 68pt; display: block; }
      .qr-label       { font-size: 8pt; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 3pt; }
      .qr-url         { font-size: 6pt; color: #555; word-break: break-all; }
    }

    /* ═══════════════════════════════════════
       モバイル
    ═══════════════════════════════════════ */
    @media (max-width: 640px) {
      .song-title  { font-size: 1.6em; }
      .yt-wrapper  { max-width: 100%; }
      .chord-sheet { padding: 20px 16px 80px; }
      .ly          { font-size: 0.93em; }
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header class="song-header">
  <div class="song-title">ドラマチック</div>
  <div class="song-artist">ハルニシオン</div>
  <div>
    <span class="key-badge">Key: <span id="key-label">G</span></span>
  </div>
  <div class="yt-wrapper">
    <iframe
      src="https://www.youtube.com/embed/SfSx-I7o8Cs"
      title="ハルニシオン「ドラマチック」Official MusicVideo"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</header>

<!-- コントロールバー -->
<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">キー</span>
    <div class="btn" onclick="adjustKey(-1)">−</div>
    <span class="val" id="key-shift-val">±0</span>
    <div class="btn" onclick="adjustKey(+1)">＋</div>
  </div>
  <div class="divider"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">カポ</span>
    <select class="capo-select" id="capo-select" onchange="updateDisplay()">
      <option value="0">なし</option>
      <option value="1">1フレット</option>
      <option value="2">2フレット</option>
      <option value="3">3フレット</option>
      <option value="4">4フレット</option>
      <option value="5">5フレット</option>
      <option value="6">6フレット</option>
      <option value="7">7フレット</option>
    </select>
  </div>
  <div class="divider"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">スクロール</span>
    <div class="btn btn-wide" id="scroll-btn" onclick="toggleScroll()">▶ 開始</div>
    <div class="btn" onclick="adjustSpeed(-1)">−</div>
    <span class="val" id="speed-val">20</span>
    <div class="btn" onclick="adjustSpeed(+1)">＋</div>
  </div>
</div>

<!-- コード譜本文 (JS が描画) -->
<main class="chord-sheet" id="chord-sheet"></main>

<!-- 印刷用QRコード（画面では非表示） -->
<div class="print-qr" id="print-qr">
  <img id="qr-img" alt="QR Code">
  <div>
    <p class="qr-label">WEB はこちら</p>
    <p class="qr-url" id="qr-url-text"></p>
  </div>
</div>

<footer class="footer">芹沢心色 弾き語り 期待.com</footer>

<script>
/* ================================================================
   ★★★ 曲データ（ここだけ編集すればOK）★★★
   ================================================================
   書き方:  [コード名]歌詞テキスト
   例:      [C]君に会いたくて[G]でも言えなくて

   ・コードの位置を変えたい → [コード名] を移動するだけ
   ・コードなしの歌詞      → そのままテキストを書く
   ・空行（段落区切り）    → '' を1行入れる
   ・instr: true          → コードのみ行（イントロ・間奏）
   ================================================================ */

// ↓ GitHub Pages 公開後にURLを書き換えてください
const WEB_URL = 'https://mikiteeth48.github.io/songs-chords/01_dramatic';

const SONG = {
  title:  'ドラマチック',
  artist: 'ハルニシオン',
  key:    'G',

  sections: [

    { label: 'イントロ', instr: true, lines: [
      '[C]　　[D]　　[G]　　',
      '[C]　　[D]　　[G]　　',
      '[C]　　[D]　　[G]　　[Em]　　',
      '[C]　　[D]　　[G]　　',
    ]},

    { label: 'Aメロ', lines: [
      '[C]独り言を言うように[G]おはようを[Em]唱えてみる',
      '[Am]窓がうつす[G]景色には[D♯]きこえない[D]',
      '[C]ヘッドホンを外して[G]君の音が[Em]聞こえた',
      '[C]遠くて近い[D]距離で[G]笑ってる',
    ]},

    { label: 'Bメロ', lines: [
      '[C]この季[D]節の真[Em]ん中で',
      '[C]降り積[D]もる雪[Em7]を見て',
      '[C]これでい[D]いんだよな[Em7]んて[F]言い聞かせ[G]た',
    ]},

    { label: 'サビ', lines: [
      '[C]どんな',
      '[C]悲しいも楽しいも[D]嬉しいも僕は',
      '[G]伝えられないで[Em]いる',
      'ドラマみ[C]たいなこの気持ちが[D]知られたく[Em]なくて[G]',
      '[C]【伝えたとしたらきっと[D]それは僕の青春の終わりで',
      '[D#dim]何も残らなくなってすべて[Em]消えてしまいそうだから だから…】',
      '[Am7]日々が過[G]ぎるのを[C]ただ待つだけ[D]しかできない',
    ]},

    { label: '間奏', instr: true, lines: [
      '[C]　　[D]　　[G]　　[Em]　　',
      '[C]　　[D]　　[G]　　',
    ]},

    { label: 'Aメロ②', lines: [
      '[C]当たり前に終わってゆく[G]今日を重ねた[Em]先に',
      '[Am]何もなくなって[G]しまうなら[D♯]さみしいな[D]',
      '[C]僕は気持ちこらえて[G]何度目だろう[Em]「またね」を…',
      '[C]伝えたい[D]気持ちはこん[G]なんじゃない',
    ]},

    { label: 'Bメロ②', lines: [
      '[C]冬がす[D]ぎて春[Em]がくる',
      '[C]意識も[D]してな[Em7]かった',
      '[C]大人に[D]なって[Em7]ゆく',
      '[F]季節が[G]おわる',
    ]},

    { label: 'サビ②', lines: [
      'こんなにも[C]雪がふって[D]手はかじかんで',
      '[Em]2人きりのド[G]ラマチック',
      'なんて[C]想像しているだけで[D]何もできや[G]しない[Em]',
      '「時間を[C]とめる魔法を[D]あげるよ　[G]今この瞬間[Em]しかない」',
      '[Am]隠れてた[Bm]くせに[C]勇気が背[D]中をおしてくる',
    ]},

    { label: 'Cメロ', lines: [
      '[C]　　[D]　　[Bm]　　[Em]　　',
      '[C]　　[D]　　[G]',
      '胸（ここ）[C]に[D]あ[Em]るもの[C][D][Em]',
      '後[C]悔[D]は[Em]した[Cm]く[Dm]な[D#]い[F]　　←ここのコードまじ綺麗芸術的',
    ]},

    { label: 'サビ③', lines: [
      '振り返れ[C]ばそこに[D]君がいるのにな',
      '[G]何もないような[Em]顔で',
      'かっこつけ[C]てた自分が[D]誇らしくて[G]馬鹿ら[Em]しい',
      '時間は[C]とまらないわ[D]かってるよ',
      '[D#dim]わかってるから[Em]大丈夫',
      '[Am]立ち止まった[G]まま　[C]また時間だけ[D]がすぎてく',
      '[Cm]　　[D]　　[C]',
    ]},

    { label: 'アウトロ', lines: [
      '[D]苦しければ苦しいほど[G/B]報われるとか',
      'そんな[Bm]切なさの[B]甲斐なんてないのは[Em]知ってる',
      'このまま[D]終わるなんてできないって思ったから[C#m]',
      '[Em]でも[Am]目の前にいる君にこの気持ちを[A]どうやって[G]伝えようって',
      '一歩[C]踏み出すだけなのに…[Cm]　[D]　　　　[C]　',
    ]},

  ]
};

/* ================================================================
   以下は表示エンジン。基本的に編集不要。
   ================================================================ */

function parseChordLine(line) {
  const parts = [];
  const firstBracket = line.indexOf('[');
  if (firstBracket > 0) parts.push({ chord: '', lyric: line.slice(0, firstBracket) });
  if (firstBracket === -1) { parts.push({ chord: '', lyric: line }); return parts; }
  const re = /\[([^\]]*)\]([^\[]*)/g;
  let m;
  while ((m = re.exec(line)) !== null) parts.push({ chord: m[1], lyric: m[2] });
  return parts;
}

function renderSong() {
  document.getElementById('key-label').textContent = SONG.key;
  const sheet = document.getElementById('chord-sheet');
  sheet.innerHTML = '';
  SONG.sections.forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    const lbl = document.createElement('span');
    lbl.className = 'section-label';
    lbl.textContent = sec.label;
    secDiv.appendChild(lbl);
    sec.lines.forEach(line => {
      if (line === '') {
        const sp = document.createElement('div'); sp.className = 'spacer'; secDiv.appendChild(sp); return;
      }
      const lineDiv = document.createElement('div');
      lineDiv.className = 'chord-line' + (sec.instr ? ' instr' : '');
      parseChordLine(line).forEach(({ chord, lyric }) => {
        const cb = document.createElement('div'); cb.className = 'cb';
        const ch = document.createElement('span'); ch.className = 'ch'; ch.dataset.chord = chord; ch.textContent = chord || ' ';
        const ly = document.createElement('span'); ly.className = 'ly'; ly.textContent = lyric !== '' ? lyric : ' ';
        cb.appendChild(ch); cb.appendChild(ly); lineDiv.appendChild(cb);
      });
      secDiv.appendChild(lineDiv);
    });
    sheet.appendChild(secDiv);
  });
}

/* 移調 */
const SHARP_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NOTES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function noteIndex(n) { const i = SHARP_NOTES.indexOf(n); return i !== -1 ? i : FLAT_NOTES.indexOf(n); }

function transposeChord(chord, semitones) {
  if (!chord || chord.trim() === '' || semitones === 0) return chord;
  const m = chord.match(/^([A-G][#b]?)(.*)/);
  if (!m) return chord;
  const [, root, rest] = m;
  const idx = noteIndex(root), newIdx = ((idx + semitones) % 12 + 12) % 12;
  const useFlat = root.includes('b') || (semitones < 0 && [1,3,6,8,10].includes(newIdx));
  const newRoot = useFlat ? FLAT_NOTES[newIdx] : SHARP_NOTES[newIdx];
  const slash = rest.match(/^([^/]*)\/([A-G][#b]?)(.*)$/);
  if (slash) {
    const [, q, bass, extra] = slash;
    const newBass = (useFlat ? FLAT_NOTES : SHARP_NOTES)[((noteIndex(bass) + semitones) % 12 + 12) % 12];
    return newRoot + q + '/' + newBass + extra;
  }
  return newRoot + rest;
}

let keyShift = 0, capo = 0;

function updateDisplay() {
  capo = parseInt(document.getElementById('capo-select').value);
  const net = keyShift - capo;
  document.getElementById('key-shift-val').textContent = keyShift === 0 ? '±0' : (keyShift > 0 ? '+' : '') + keyShift;
  const currentKey = SHARP_NOTES[((noteIndex(SONG.key) + keyShift) % 12 + 12) % 12];
  document.getElementById('key-label').textContent = currentKey + (capo > 0 ? `（Capo ${capo}）` : '');
  document.querySelectorAll('.ch[data-chord]').forEach(el => { el.textContent = transposeChord(el.dataset.chord, net) || ' '; });
}

function adjustKey(delta) { keyShift = Math.max(-6, Math.min(6, keyShift + delta)); updateDisplay(); }

/* 自動スクロール */
let scrollID = null, speed = 20;

function toggleScroll() {
  if (scrollID) { clearInterval(scrollID); scrollID = null; document.getElementById('scroll-btn').textContent = '▶ 開始'; }
  else { scrollID = setInterval(() => window.scrollBy(0, 1), Math.max(8, 2200 / speed)); document.getElementById('scroll-btn').textContent = '⏹ 停止'; }
}

function adjustSpeed(delta) {
  speed = Math.max(1, Math.min(100, speed + delta));
  document.getElementById('speed-val').textContent = speed;
  if (scrollID) { clearInterval(scrollID); scrollID = setInterval(() => window.scrollBy(0, 1), Math.max(8, 2200 / speed)); }
}

document.addEventListener('keydown', e => {
  if (e.key === ' ')         { e.preventDefault(); toggleScroll(); }
  if (e.key === 'ArrowUp')   adjustSpeed(+2);
  if (e.key === 'ArrowDown') adjustSpeed(-2);
});

renderSong();
updateDisplay();

// QRコード設定
document.getElementById('qr-img').src =
  `https://api.qrserver.com/v1/create-qr-code/?size=140x140&color=000000&bgcolor=ffffff&data=${encodeURIComponent(WEB_URL)}`;
document.getElementById('qr-url-text').textContent = WEB_URL;
</script>
</body>
</html>
